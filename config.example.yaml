# Your settings. setup.bat copies this to config.yaml; anything left out uses the defaults in capri/config.py.

user_name: choom             # what Capri calls you

desk:
  size: 240                  # her height in pixels
  video_size: 360            # her height in video mode (big enough for a 9:16 phone crop)
  roam_seconds: [18, 40]     # she defrags somewhere new every this-many seconds
  intro: true                # drop in from the top of the screen on launch
  dj: false                  # first-run default for 'Let her DJ' (she swaps your YouTube music for Cyberpunk OSTs)
  chatter_idle_minutes: 6    # quiet this long and she says something

stt:                         # her ears (faster-whisper on the GPU)
  mode: hold                 # hold = hold the talk key while you speak | auto = always listening | off
  talk_key: ctrl+1           # any combo: ctrl+space, alt+q, f8, mouse4... (or rebind from her menu: Ears > Change talk key)
  input_device: ''           # part of your mic's name; '' = Windows default (also pickable in her menu)
  model: small.en            # faster-whisper model: tiny.en / base.en / small.en / medium.en

llm:
  backend: llama_cpp         # llama_cpp | openai (LM Studio, Ollama, llama-server...)
  model_path: ''             # '' = models\Mistral-Nemo-Instruct-2407-IQ4_XS.gguf (what setup.bat downloads)
  n_gpu_layers: -1           # -1 = all on the GPU
  n_ctx: 5120
  # for backend: openai
  base_url: http://127.0.0.1:1234/v1
  model: local-model

voice: blips                 # blips (old-school RPG talking blips) | none

spotify:                     # https://developer.spotify.com/dashboard, needs Premium. Without it, "play X" uses YouTube
  client_id: ''
  client_secret: ''
  redirect_uri: http://127.0.0.1:8888/callback
