# Copy to config.yaml (run.bat does this on first launch). Anything left out uses the defaults in capri/config.py.

user_name: Hibura            # what Capri calls you
eru_ai_root: 'D:\ERU AI'
eru:
  memory: true               # ERU's Qdrant vector memory, but in Capri's own store under data\

desk:
  size: 240                  # her height in pixels
  video_size: 360            # her height in video mode (big enough for a 9:16 phone crop)
  roam_seconds: [18, 40]     # she zaps somewhere new every this-many seconds
  intro: true                # drop in from the top of the screen on launch
  dj: false                  # first-run default for 'Let her DJ' (she swaps your YouTube music for Cyberpunk OSTs)
  chatter_idle_minutes: 6    # quiet this long and she says something

stt:                         # her ears (faster-whisper, ERU's "small" model on the GPU)
  mode: hold                 # hold = hold the talk key while you speak | auto = always listening | off
  talk_key: ctrl+1           # any combo, e.g. ctrl+space, alt+q, f8, mouse4. Rebind from her menu: Ears > Change talk key
  input_device: ''                # part of the mic's name; '' = Windows default. Also pickable in her menu

llm:
  backend: llama_cpp         # llama_cpp | openai
  model_path: 'D:\ERU AI\models\llm\Mistral-Nemo-Instruct-2407\Mistral-Nemo-Instruct-2407-IQ4_XS.gguf'
  n_gpu_layers: -1
  n_ctx: 5120
  # for backend: openai (LM Studio, Ollama, llama-server ...)
  base_url: http://127.0.0.1:1234/v1
  model: local-model

tts:
  backend: blips             # blips (RPG talking blips) | gpt_sovits (her cloned voice) | none
  gpt_sovits:                # server: voice_server\sovits_server.py (ERU's GPT-SoVITS v2, zero-shot), started for you
    url: http://127.0.0.1:9880/tts
    ref_audio_path: ''       # empty = voices\capri\ref.wav
    prompt_text: ''          # empty = voices\capri\ref.txt
    prompt_lang: en
    text_lang: en
    speed_factor: 1.0

spotify:                     # https://developer.spotify.com/dashboard, needs Premium. Without it, "play X" uses YouTube
  client_id: ''
  client_secret: ''
  redirect_uri: http://127.0.0.1:8888/callback
