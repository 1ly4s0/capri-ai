name: Source compatibility

on:
  workflow_call:

permissions:
  contents: read

jobs:
  source:
    name: Source (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: portable/requirements.txt
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1 libegl1 libopengl0 libxcb-cursor0
      - name: Install source dependencies
        run: python -m pip install -r portable/requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q capri capri_dev.py scripts tests
      - name: Check Linux launchers
        if: runner.os == 'Linux'
        run: bash -n arch/run.sh kali/run.sh
      - name: Run release tests
        run: python -m unittest discover -s tests -v
      - name: Check source runtime without devices or downloads
        env:
          QT_QPA_PLATFORM: offscreen
          CAPRI_HOME: ${{ runner.temp }}/capri-smoke
          CAPRI_SMOKE_REPORT: ${{ runner.temp }}/capri-smoke-report.json
        run: python capri_dev.py --smoke-test "$env:CAPRI_SMOKE_REPORT"
        shell: pwsh
