name: CI

on:
  pull_request:
  push:
    branches: ['main', 'master', 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate source and Windows package
    uses: ./.github/workflows/package.yml
